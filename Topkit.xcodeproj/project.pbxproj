			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# The build number About shows. Taken from the git commit count: monotonic, and it\n# maps straight back to a commit. Stamped into the built bundle only, so the source\n# Info.plist stays put and no build dirties the tree. Code signing runs after this\n# phase, so the edit is inside the signature.\nset -euo pipefail\nPLIST=\"${TARGET_BUILD_DIR}/${INFOPLIST_PATH}\"\n[ -f \"$PLIST\" ] || exit 0\nBUILD=\"$(cd \"${SRCROOT}\" && git rev-list --count HEAD 2>/dev/null || true)\"\n[ -n \"$BUILD\" ] || exit 0\n/usr/libexec/PlistBuddy -c \"Set :CFBundleVersion $BUILD\" \"$PLIST\"\n";
		};
		IC0NSCR1PT2B3U4I5L6D7PH8 /* Compile Tahoe Icon */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputPaths = (
				"$(SRCROOT)/Topkit/AppIcon.icon",
				"$(SRCROOT)/Topkit/Assets.xcassets",
			);
			name = "Compile Tahoe Icon";
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/bash;
			shellScript = "# Compile .xcassets + .icon into one Assets.car (Tahoe layered app icon).\n# Stage to a temp dir first: the out-of-process .icon renderer is denied access\n# to the project folder on some macOS TCC/provenance states (\"permission to\n# view\" / status 255), which silently ships the flat fallback. A TMPDIR copy is\n# always readable. Fail loudly if the layered catalog is missing.\nset -euo pipefail\nICON_PATH=\"${SRCROOT}/Topkit/AppIcon.icon\"\nXCASSETS_PATH=\"${SRCROOT}/Topkit/Assets.xcassets\"\nOUTPUT_DIR=\"${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}\"\nif [ -d \"$ICON_PATH\" ]; then\n  STAGE=\"$(mktemp -d)\"\n  trap 'rm -rf \"$STAGE\"' EXIT\n  cp -R \"$XCASSETS_PATH\" \"$STAGE/Assets.xcassets\"\n  cp -R \"$ICON_PATH\" \"$STAGE/AppIcon.icon\"\n  xattr -cr \"$STAGE\" 2>/dev/null || true\n  xcrun actool \"$STAGE/Assets.xcassets\" \"$STAGE/AppIcon.icon\" --compile \"$OUTPUT_DIR\" --output-format human-readable-text --notices --warnings --errors --output-partial-info-plist /dev/null --app-icon AppIcon --include-all-app-icons --enable-on-demand-resources NO --development-region en --target-device mac --minimum-deployment-target \"${MACOSX_DEPLOYMENT_TARGET}\" --platform macosx\n  SIZE=$(stat -f%z \"$OUTPUT_DIR/Assets.car\" 2>/dev/null || echo 0)\n  if [ \"$SIZE\" -lt 200000 ]; then\n    # CI runners' actool predates Tahoe layered icons; a Debug test build\n    # there may keep the flat fallback. Release/archive builds still hard-fail\n    # so a flat icon can never ship (see icon guard history).\n    if [ \"${CI:-false}\" = \"true\" ] && [ \"${CONFIGURATION}\" = \"Debug\" ]; then\n      echo \"warning: Tahoe layered icon unavailable (Assets.car $SIZE bytes); CI Debug build keeps the flat fallback.\"\n    else\n      echo \"error: Tahoe layered icon failed (Assets.car $SIZE bytes); refusing flat fallback.\" >&2\n      exit 1\n    fi\n  fi\nfi\n";
		};
/* End PBXShellScriptBuildPhase section */

